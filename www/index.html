<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Bantora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/></noscript>
<style>
/* ── Reset ──────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#000;
  --white:#fff;
  --grey1:#111;
  --grey2:#1a1a1a;
  --grey3:#2a2a2a;
  --grey4:#444;
  --grey5:#888;
  --grey6:#aaa;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,34px);
  --tab-h:54px;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--black);color:var(--white);
  font-family:'Inter',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ── Animations ─────────────────────────────── */
@keyframes sway{
  0%{transform:scale(1.5)translate(0,0)}
  50%{transform:scale(1.6)translate(2%,-2%)}
  100%{transform:scale(1.5)translate(-2%,2%)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{to{transform:scale(2);opacity:0}}
@keyframes b1{0%,100%{height:3px}50%{height:14px}}
@keyframes b2{0%,100%{height:8px}50%{height:3px}}
@keyframes b3{0%,100%{height:12px}50%{height:5px}}
@keyframes b4{0%,100%{height:4px}50%{height:16px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes trackIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* ── Shell ──────────────────────────────────── */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--black)}

/* Background blur — only on player */
#bg-img{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-size:cover;background-position:center;
  opacity:0;filter:blur(60px) saturate(1.8);
  animation:sway 25s ease-in-out infinite alternate;
  transition:background-image .8s ease,opacity .5s ease;
}
#bg-img.visible{opacity:.18}
#bg-fade{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.96) 40%,rgba(0,0,0,.6) 75%,rgba(0,0,0,.3));
}

/* ── Tab bar ────────────────────────────────── */
#tabbar{
  position:relative;z-index:80;flex-shrink:0;
  display:flex;
  height:calc(var(--tab-h) + var(--safe-bot));
  padding-bottom:var(--safe-bot);
  background:var(--black);
  border-top:1px solid var(--grey2);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;
  background:none;border:none;
  color:var(--grey5);font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  cursor:pointer;transition:color .15s;
  padding-bottom:2px;
}
.tab.active{color:var(--white)}
.tab svg{
  width:20px;height:20px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
}
/* active tab has a top line */
.tab.active::before{
  content:'';display:block;
  position:absolute;top:0;
  width:24px;height:2px;
  background:var(--white);
  border-radius:0 0 2px 2px;
}
.tab{position:relative}

/* ── Screens ────────────────────────────────── */
#screens{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ══════════════════════════════════════════════
   PLAYER SCREEN
══════════════════════════════════════════════ */
#scr-player{background:transparent}

/* Top bar */
#player-top{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 10px) 20px 10px;
  z-index:10;
}
.now-chip{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:99px;padding:5px 12px 5px 8px;
}
.now-dot{width:6px;height:6px;border-radius:50%;background:var(--white);flex-shrink:0}
.now-text{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.04em}
.icon-circle{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;
}
.icon-circle:active{background:rgba(255,255,255,.15);transform:scale(.9)}
.icon-circle svg{width:15px;height:15px;stroke:rgba(255,255,255,.7);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Stage */
#player-stage{
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 24px 8px;pointer-events:none;
}

/* Cover — square with border, Tidal style */
#cover-wrap{
  position:relative;
  width:min(240px,60vw);
  margin-bottom:28px;
  animation:fadeUp .4s ease;
}
#cover-img{
  width:100%;aspect-ratio:1;
  object-fit:cover;
  display:block;
  border-radius:4px;
  transition:opacity .6s;
  box-shadow:0 24px 64px rgba(0,0,0,.8);
}
/* Spinning ring only when playing */
#ring-wrap{
  position:absolute;inset:-5px;
  border-radius:8px;
  background:conic-gradient(from 0deg,rgba(255,255,255,.6),transparent 70%);
  animation:spin 6s linear infinite;
  opacity:0;transition:opacity .4s;
}
#ring-wrap.on{opacity:1}

#track-area{text-align:center;width:100%;max-width:300px;animation:fadeUp .4s ease .1s both}
#track-title{
  font-size:clamp(18px,5.5vw,28px);
  font-weight:800;letter-spacing:-.04em;
  line-height:1.15;color:var(--white);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
#track-artist{
  font-size:13px;font-weight:400;color:var(--grey6);
  margin-top:6px;letter-spacing:.01em;
}

/* Controls */
#player-controls{
  flex-shrink:0;padding:0 20px 16px;
}

/* Seek */
#seek-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.tlbl{font-size:10px;font-family:monospace;color:var(--grey5);min-width:28px}
.tlbl.r{text-align:right}
#seek-track{
  flex:1;position:relative;height:3px;
  background:var(--grey3);border-radius:99px;cursor:pointer;
}
#seek-fill{
  position:absolute;top:0;left:0;height:100%;
  background:var(--white);border-radius:99px;
  pointer-events:none;transition:width .1s linear;
}
#seek-input{
  position:absolute;inset:-6px 0;width:100%;height:calc(100% + 12px);
  opacity:0;cursor:pointer;-webkit-appearance:none;
}

/* Buttons */
#ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.ctrl{
  width:44px;height:44px;border-radius:50%;background:none;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s;color:var(--grey5);
}
.ctrl:active{transform:scale(.85)}
.ctrl svg{width:22px;height:22px;stroke:currentColor;fill:currentColor;stroke-width:1.5}
.ctrl.secondary{color:var(--grey4)}
.ctrl.secondary svg{width:18px;height:18px}
#play-btn{
  width:58px;height:58px;border-radius:50%;
  background:var(--white);border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .15s;
  position:relative;
  box-shadow:0 4px 20px rgba(255,255,255,.15);
}
#play-btn:active{transform:scale(.9)}
#play-btn svg{width:22px;height:22px;fill:var(--black);stroke:none}
#play-ping{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.2);
  animation:ping 1s ease-out infinite;display:none;
}

/* ══════════════════════════════════════════════
   LIBRARY SCREEN
══════════════════════════════════════════════ */
#scr-lib{background:var(--black)}
.lib-view{flex:1;min-height:0;overflow-y:auto;display:none;flex-direction:column;scrollbar-width:none}
.lib-view::-webkit-scrollbar{display:none}
.lib-view.active{display:flex}

/* Header */
.lib-hdr{
  flex-shrink:0;
  padding:calc(var(--safe-top) + 12px) 20px 0;
  background:var(--black);
  position:sticky;top:0;z-index:10;
}
.lib-hdr-row{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--grey2)}
.hdr-back{
  width:32px;height:32px;border-radius:50%;background:var(--grey2);
  border:none;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:all .15s;
}
.hdr-back:active{background:var(--grey3);transform:scale(.88)}
.hdr-back svg{width:16px;height:16px;stroke:var(--white);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr-text{flex:1;min-width:0}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:11px;color:var(--grey5);margin-top:2px;font-weight:400}
.hdr-btn{
  background:var(--white);border:none;border-radius:99px;
  padding:8px 16px;color:var(--black);
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;flex-shrink:0;transition:all .15s;
}
.hdr-btn:active{opacity:.75;transform:scale(.95)}
.hdr-btn-ghost{
  background:transparent;border:1px solid var(--grey3);border-radius:99px;
  padding:7px 14px;color:var(--white);
  font-size:11px;font-weight:600;letter-spacing:.04em;
  cursor:pointer;flex-shrink:0;transition:all .15s;
  display:flex;align-items:center;gap:5px;
}
.hdr-btn-ghost:active{background:var(--grey2)}
.hdr-btn-ghost svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Stats bar */
.stats-strip{
  display:flex;gap:1px;margin:16px 20px;
  background:var(--grey2);border-radius:8px;overflow:hidden;flex-shrink:0;
}
.stat-item{
  flex:1;padding:12px 0;text-align:center;background:var(--grey1);
}
.stat-n{font-size:18px;font-weight:800;letter-spacing:-.03em}
.stat-l{font-size:10px;color:var(--grey5);margin-top:2px;text-transform:uppercase;letter-spacing:.08em}

/* Section label */
.sec-lbl{
  padding:0 20px 10px;flex-shrink:0;
  font-size:10px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--grey5);
}
.sec-row{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;flex-shrink:0}
.sec-action{font-size:12px;font-weight:600;color:var(--grey6);cursor:pointer;letter-spacing:.02em}
.sec-action.danger{color:#f87171}

/* Playlist list — horizontal scroll then grid */
.pl-scroll{
  display:flex;gap:12px;padding:0 20px 20px;
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.pl-scroll::-webkit-scrollbar{display:none}
.pl-tile{
  flex-shrink:0;width:140px;cursor:pointer;transition:opacity .15s;
}
.pl-tile:active{opacity:.65}
.pl-tile.now .pl-tile-img-wrap::after{
  content:'';position:absolute;inset:0;
  border:2px solid var(--white);border-radius:4px;
}
.pl-tile-img-wrap{position:relative;width:140px;height:140px;border-radius:4px;overflow:hidden;background:var(--grey2)}
.pl-tile-img{width:100%;height:100%;object-fit:cover;display:block}
.pl-tile-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.pl-tile-ph svg{width:36px;height:36px;stroke:var(--grey4);fill:none;stroke-width:1.5}
.pl-tile-name{font-size:12px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-tile-count{font-size:11px;color:var(--grey5);margin-top:2px}
.pl-new-tile{
  flex-shrink:0;width:140px;height:140px;border-radius:4px;
  border:1.5px dashed var(--grey3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;transition:all .15s;
}
.pl-new-tile:active{background:var(--grey1)}
.pl-new-tile svg{width:24px;height:24px;stroke:var(--grey4);fill:none;stroke-width:1.5}
.pl-new-tile span{font-size:11px;color:var(--grey5);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* Upload zone */
.upload-btn{
  display:flex;align-items:center;gap:14px;
  margin:4px 20px 12px;padding:14px 16px;
  background:var(--grey1);border:1px solid var(--grey2);
  border-radius:6px;cursor:pointer;transition:all .15s;flex-shrink:0;
}
.upload-btn:active{background:var(--grey2)}
.upload-icon{
  width:36px;height:36px;border-radius:4px;background:var(--white);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.upload-icon svg{width:18px;height:18px;stroke:var(--black);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.upload-text-title{font-size:13px;font-weight:700}
.upload-text-sub{font-size:11px;color:var(--grey5);margin-top:1px}

/* Progress */
.prog-box{margin:0 20px 12px;display:none;flex-shrink:0}
.prog-box.show{display:block}
.prog-lbl{font-size:11px;color:var(--grey5);margin-bottom:6px}
.prog-track{height:2px;background:var(--grey2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--white);border-radius:99px;transition:width .2s}

/* Song rows */
.songs-wrap{flex:1;overflow-y:auto;scrollbar-width:none}
.songs-wrap::-webkit-scrollbar{display:none}
.song-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 20px;cursor:pointer;transition:background .1s;
}
.song-row:active{background:var(--grey1)}
.song-row.playing{background:rgba(255,255,255,.04)}
.s-num{width:20px;font-size:11px;font-family:monospace;color:var(--grey4);text-align:center;flex-shrink:0}
.song-row.playing .s-num{display:none}
.s-wave{display:none;align-items:flex-end;gap:2px;height:14px;width:20px;flex-shrink:0}
.song-row.playing .s-wave{display:flex}
.sv{width:2px;border-radius:99px;background:var(--white);min-height:3px}
.sv1{animation:b1 .7s ease-in-out infinite}
.sv2{animation:b2 .8s ease-in-out infinite .1s}
.sv3{animation:b3 .65s ease-in-out infinite .2s}
.sv4{animation:b4 .9s ease-in-out infinite .05s}
.s-art{
  width:44px;height:44px;border-radius:3px;flex-shrink:0;
  background:var(--grey2);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.s-art svg{width:18px;height:18px;stroke:var(--grey4);fill:none;stroke-width:1.5}
.s-art img{width:100%;height:100%;object-fit:cover}
.s-info{flex:1;min-width:0}
.s-name{
  font-size:13px;font-weight:500;color:rgba(255,255,255,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.song-row.playing .s-name{color:var(--white);font-weight:600}
.s-meta{font-size:11px;color:var(--grey5);margin-top:2px}
.s-del{
  width:28px;height:28px;border-radius:50%;background:none;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--grey4);transition:all .15s;flex-shrink:0;
}
.s-del:active{color:#f87171;background:rgba(248,113,113,.1);transform:scale(.88)}
.s-del svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.empty-state{
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px;text-align:center;
}
.empty-state svg{width:40px;height:40px;stroke:var(--grey3);fill:none;stroke-width:1.4;margin-bottom:14px}
.empty-ttl{font-size:15px;font-weight:700;color:var(--grey5)}
.empty-sub{font-size:12px;color:var(--grey4);margin-top:5px;line-height:1.55}

/* ── Mini player ─────────────────────────────── */
#mini-player{
  flex-shrink:0;
  display:none;align-items:center;gap:12px;
  height:60px;padding:0 16px;
  background:var(--grey1);border-top:1px solid var(--grey2);
  cursor:pointer;position:relative;z-index:20;
}
#mini-player.show{display:flex}
#mini-cover{width:38px;height:38px;border-radius:3px;object-fit:cover;flex-shrink:0;background:var(--grey2)}
#mini-info{flex:1;min-width:0}
#mini-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini-sub{font-size:11px;color:var(--grey5);margin-top:1px}
#mini-prog{position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--grey2)}
#mini-bar{height:100%;background:var(--white);transition:width .3s linear}
.m-btn{
  width:32px;height:32px;border-radius:50%;background:none;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;color:var(--white);
}
.m-btn:active{transform:scale(.85)}
.m-btn svg{width:18px;height:18px;fill:currentColor;stroke:none}

/* ── Modal sheet ─────────────────────────────── */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.8);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal-sheet{
  width:100%;background:var(--grey1);
  border-radius:16px 16px 0 0;
  border-top:1px solid var(--grey2);
  padding-bottom:calc(var(--safe-bot) + 12px);
  animation:sheetUp .3s cubic-bezier(.16,1,.3,1);
}
.sh-handle{width:32px;height:3px;border-radius:99px;background:var(--grey3);margin:10px auto 0}
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.sh-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.sh-x{
  width:26px;height:26px;border-radius:50%;background:var(--grey2);border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sh-x svg{width:13px;height:13px;stroke:var(--grey6);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sh-body{padding:0 18px 6px}
.f-lbl{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--grey5);display:block;margin-bottom:7px}
.f-in{
  width:100%;background:var(--grey2);border:1px solid var(--grey3);
  border-radius:6px;padding:12px 14px;color:var(--white);
  font-size:15px;font-family:inherit;outline:none;margin-bottom:13px;
  transition:border-color .15s;
}
.f-in:focus{border-color:var(--grey5)}
.f-in::placeholder{color:var(--grey4)}
.cov-row{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.cov-box{
  width:64px;height:64px;border-radius:4px;overflow:hidden;flex-shrink:0;
  background:var(--grey2);border:1px solid var(--grey3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.cov-box img{width:100%;height:100%;object-fit:cover}
.cov-box svg{width:24px;height:24px;stroke:var(--grey4);fill:none;stroke-width:1.5}
.cov-hint p{font-size:13px;color:var(--white);margin-bottom:2px}
.cov-hint small{font-size:11px;color:var(--grey5)}
.cov-change{font-size:12px;color:var(--grey6);margin-top:5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.sh-foot{display:flex;gap:8px;padding:6px 18px 0}
.btn-cancel{
  flex:1;padding:13px;border-radius:6px;
  background:var(--grey2);border:1px solid var(--grey3);
  color:var(--grey6);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;
}
.btn-cancel:active{background:var(--grey3)}
.btn-primary{
  flex:2;padding:13px;border-radius:6px;
  background:var(--white);border:none;
  color:var(--black);font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;
}
.btn-primary:active{opacity:.75}
.btn-danger-row{
  width:100%;padding:13px;border-radius:6px;
  background:transparent;border:1px solid rgba(248,113,113,.3);
  color:#f87171;font-size:14px;font-weight:700;cursor:pointer;
  margin-bottom:8px;transition:all .15s;
}
.btn-danger-row:active{background:rgba(248,113,113,.1)}

/* Confirm sheet */
.conf-sheet{
  width:100%;background:var(--grey1);
  border-radius:16px 16px 0 0;border-top:1px solid var(--grey2);
  padding:22px 18px calc(var(--safe-bot) + 10px);
}
.conf-ttl{font-size:16px;font-weight:800;text-align:center;margin-bottom:5px}
.conf-msg{font-size:13px;color:var(--grey5);text-align:center;margin-bottom:18px;line-height:1.5}

/* ── Toast ───────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(var(--safe-bot) + 68px);left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--grey2);border:1px solid var(--grey3);
  border-radius:99px;padding:8px 18px;
  font-size:12px;font-weight:600;color:var(--grey6);
  letter-spacing:.02em;
  opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.16,1,.3,1);
  z-index:500;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <!-- Background (only player uses it) -->
  <div id="bg-img"></div>
  <div id="bg-fade"></div>

  <!-- Screens -->
  <div id="screens">

    <!-- ══ PLAYER ══ -->
    <div class="screen active" id="scr-player">

      <div id="player-top">
        <div class="now-chip">
          <div class="now-dot"></div>
          <div class="now-text" id="now-pl-name">Bantora</div>
        </div>
        <div class="icon-circle" id="btn-open-lib">
          <svg viewBox="0 0 24 24"><path d="M3 18V4l7-1v14M3 11h7M14 18V7l7-1v12M14 12h7"/></svg>
        </div>
      </div>

      <div id="player-stage">
        <div id="cover-wrap">
          <div id="ring-wrap"></div>
          <img id="cover-img" src="logo.png" alt=""/>
        </div>
        <div id="track-area">
          <div id="track-title">Select a track</div>
          <div id="track-artist">Bantora</div>
        </div>
      </div>

      <div id="player-controls">
        <div id="seek-row">
          <span class="tlbl" id="t-cur">00:00</span>
          <div id="seek-track">
            <div id="seek-fill" style="width:0%"></div>
            <input type="range" id="seek-input" min="0" max="100" value="0" step="0.1"/>
          </div>
          <span class="tlbl r" id="t-tot">00:00</span>
        </div>
        <div id="ctrl-row">
          <button class="ctrl secondary" id="btn-prev">
            <svg viewBox="0 0 24 24"><polygon points="19,20 9,12 19,4"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button id="play-btn">
            <div id="play-ping"></div>
            <svg id="ic-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
            <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          </button>
          <button class="ctrl secondary" id="btn-next">
            <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
        </div>
      </div>

    </div><!-- /scr-player -->

    <!-- ══ LIBRARY ══ -->
    <div class="screen" id="scr-lib">

      <!-- View: All Playlists -->
      <div class="lib-view active" id="view-all">
        <div class="lib-hdr">
          <div class="lib-hdr-row">
            <div class="hdr-text">
              <div class="hdr-title">Library</div>
              <div class="hdr-sub" id="lib-sub-txt">Your playlists</div>
            </div>
            <button class="hdr-btn" id="btn-new-pl">+ New</button>
          </div>
        </div>

        <div class="stats-strip">
          <div class="stat-item">
            <div class="stat-n" id="st-pl">0</div>
            <div class="stat-l">Playlists</div>
          </div>
          <div class="stat-item">
            <div class="stat-n" id="st-songs">0</div>
            <div class="stat-l">Songs</div>
          </div>
          <div class="stat-item">
            <div class="stat-n" id="st-size">0</div>
            <div class="stat-l">MB Used</div>
          </div>
        </div>

        <div class="sec-lbl">All Playlists</div>
        <div class="pl-scroll" id="pl-scroll"></div>
      </div><!-- /view-all -->

      <!-- View: Playlist Detail -->
      <div class="lib-view" id="view-detail">
        <div class="lib-hdr">
          <div class="lib-hdr-row">
            <button class="hdr-back" id="btn-back">
              <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
            </button>
            <div class="hdr-text">
              <div class="hdr-title" id="det-title">Playlist</div>
              <div class="hdr-sub" id="det-sub">0 songs</div>
            </div>
            <button class="hdr-btn-ghost" id="btn-edit-pl">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit
            </button>
          </div>
        </div>

        <div class="upload-btn" id="upload-zone">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </div>
          <div>
            <div class="upload-text-title">Add Songs</div>
            <div class="upload-text-sub">MP3, M4A, AAC — multiple OK</div>
          </div>
        </div>
        <input type="file" id="file-pick" accept="audio/*" multiple style="display:none"/>

        <div class="prog-box" id="prog-wrap">
          <div class="prog-lbl" id="prog-lbl">Adding…</div>
          <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
        </div>

        <div class="sec-row">
          <div class="sec-lbl" style="padding:0" id="det-count">Songs</div>
          <div class="sec-action danger" id="btn-del-pl">Delete</div>
        </div>

        <div class="songs-wrap">
          <div id="songs-list"></div>
        </div>

      </div><!-- /view-detail -->

      <!-- Mini player -->
      <div id="mini-player" onclick="goTab('player')">
        <img id="mini-cover" src="logo.png" alt=""/>
        <div id="mini-info">
          <div id="mini-title">—</div>
          <div id="mini-sub">Tap to open</div>
        </div>
        <button class="m-btn" id="mini-play-btn" onclick="event.stopPropagation();togglePlay()">
          <svg id="mi-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="mi-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="m-btn" onclick="event.stopPropagation();audioNext()">
          <svg viewBox="0 0 24 24"><polygon points="5,4 15,12 5,20"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <div id="mini-prog"><div id="mini-bar" style="width:0%"></div></div>
      </div>

    </div><!-- /scr-lib -->
  </div><!-- /screens -->

  <!-- Tab bar -->
  <div id="tabbar">
    <button class="tab active" id="tab-player" onclick="goTab('player')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>
      Player
    </button>
    <button class="tab" id="tab-library" onclick="goTab('library')">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Library
    </button>
  </div>

  <!-- Modal: Create/Edit Playlist -->
  <div class="modal-bg" id="pl-modal">
    <div class="modal-sheet">
      <div class="sh-handle"></div>
      <div class="sh-hdr">
        <div class="sh-title" id="sh-modal-title">New Playlist</div>
        <button class="sh-x" id="sh-close"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="sh-body">
        <div class="cov-row">
          <div class="cov-box" id="cov-box" onclick="document.getElementById('cov-file').click()">
            <img id="cov-preview" src="" alt="" style="display:none"/>
            <svg id="cov-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
          </div>
          <div class="cov-hint">
            <p>Cover Image</p>
            <small>Optional · JPEG or PNG</small>
            <div class="cov-change" onclick="document.getElementById('cov-file').click()">Change cover</div>
          </div>
        </div>
        <input type="file" id="cov-file" accept="image/*" style="display:none"/>
        <label class="f-lbl">Playlist Name</label>
        <input type="text" class="f-in" id="pl-name-input" placeholder="e.g. My Favourites"/>
        <label class="f-lbl">Description</label>
        <input type="text" class="f-in" id="pl-desc-input" placeholder="Optional"/>
      </div>
      <div class="sh-foot">
        <button class="btn-cancel" id="sh-cancel-btn">Cancel</button>
        <button class="btn-primary" id="sh-save-btn">Create Playlist</button>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div class="modal-bg" id="conf-modal">
    <div class="conf-sheet">
      <div class="conf-ttl" id="conf-ttl">Delete?</div>
      <div class="conf-msg" id="conf-msg"></div>
      <button class="btn-danger-row" id="conf-ok">Delete</button>
      <button class="btn-cancel" style="width:100%;text-align:center;padding:12px" id="conf-cancel">Cancel</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════ */
const BUNDLED = [
  { id:"bp", type:"bundled", name:"Playlist", folder:"playlist", cover:"songs/playlist/cover.jpeg",
    songs:["Angels-For-Each-Other-Mp3-Song-by-Martin-Garrix(PagalWorldi.com.co).mp3","Dil-Dil-Dil-Mp3-Song-by-Sunidhi-Chauhan(PagalWorldi.com.co).mp3","Don't-Worry-I'll-Make-You-Worry-Mp3-Song-by-Sabrina-Carpenter(PagalWorldi.com.co).mp3","Haseen-Mp3-Song-by-Talwiinder(PagalWorldi.com.co).mp3","Let-Me-Down-Slowly-Mp3-Song-by-Alec-Benjamin(PagalWorldi.com.co).mp3","Pal-Pal-Mp3-Song-by-Afusic(PagalWorldi.com.co).mp3","Raanjhanaa-Mp3-Song-by-A.R.-Rahman(PagalWorldi.com.co).mp3","Tere-Ishk-Mein-Mp3-Song-by-Arijit-Singh(PagalWorldi.com.co).mp3","Toronto-Mp3-Song-by-Raj-Brar(PagalWorldi.com.co).mp3","Usey-Kehna-Mp3-Song-by-A.R.-Rahman(PagalWorldi.com.co).mp3"] },
  { id:"bl", type:"bundled", name:"Lofi Songs", folder:"lofisongs", cover:"songs/lofisongs/cover.jpeg",
    songs:["Jalwa O Romeo 128 Kbps.mp3","Naam-Chale-Mp3-Song-by-Vikram-Sarkar(PagalWorldi.com.co).mp3","Raanjhanaa-Mp3-Song-by-A.R.-Rahman(PagalWorldi.com.co).mp3","Rihaayi-Mp3-Song-by-Paradox(PagalWorldi.com.co).mp3","Tera-Ban-Jaunga-Mp3-Song-by-Dj-Yogi(PagalWorldi.com.co).mp3","Title Track O Romeo 320 Kbps.mp3"] },
  { id:"bs", type:"bundled", name:"Seedhe Maut", folder:"seedhemuat", cover:"songs/seedhemuat/cover.jpeg",
    songs:["Khatta Flow(KoshalWorld.Com).mp3","Lunch_Break_India_Tour_Begins!_320k.mp3","Maina(KoshalWorld.Com).mp3","SMX_10_YEARS_OF_SEEDHE_MAUT_@SeedheMaut_128k.mp3","Seedhe_Maut_,_Hurricane_-_PANCAKE_DL91_FM_320k.mp3","Seedhe_Maut_-_BURE_DIN_ft._Mick_Jenkins_(Prod._Hisab)_320k.mp3","Seedhe_Maut_-_Khush_Nahi_Shakti_dl91_320k.mp3","Seedhe_Maut_-_NAMUNA_SRK_320k.mp3","Seedhe_Maut_-_RED_320k.mp3","Seedhe_Maut_-_Raat_ki_Rani_Shakti_dl91_320k.mp3","Seedhe_Maut_-_TOUR_SHIT!_320k.mp3","Seedhe_Maut_Sez_On_The_Beat_-_Kranti_-_Welcome_to_Bayaan_(mp3.pm).mp3","Seedhe_Maut_Sez_On_The_Beat_-_Saans_Le_(mp3.pm).mp3","Seedhe_Maut_Sez_On_The_Beat_-_Shaktimaan_(mp3.pm).mp3"] },
  { id:"bcd", type:"bundled", name:"Chaar Diwaari", folder:"chaardiwari", cover:"songs/chaardiwari/cover.jpeg",
    songs:["Chaar Diwaari - Jhaag (Official Video)  Def Jam India.mp3","Chaar Diwaari - Thehra (Official Video)  Pyaar Diwaari Arc 1  Def Jam India.mp3","Chaar Diwaari ft. Encore ABJ - Chaand (Tu Jo Dekh Le)  Parvana EP  Def Jam India.mp3","Chaar Diwaari ft. Indian Ocean, Gini - Aashiqana  Parvana EP  Def Jam India.mp3","Chaar Diwaari ft. Indian Ocean, Gini - Aashiqana  Parvana EP  Def Jam India (1).mp3","Chaar Diwaari ft. Sonu Nigam - Iss Tarah  Parvana EP  Def Jam India.mp3","Chaar Diwaari x @raftaarmusic - FAREBI (Live)  What We Cookin.mp3","Chaar Diwaari x Sanjith Hegde - Banda Kaam Ka (Official Video)  Parvana EP  Def Jam India.mp3","Cigarette.mp3","GHAR - Farhan Khan ft. Mehtab Ali Niazi (Prod.by @DEETOCX ) ALIF LAILA.mp3","JANNAT  Farhan Khan  Official Music Video  Prod.by Mr. Doss  The Musical Drama.mp3","JAWAB DE - Farhan Khan ( Prod. By __@DEETOCX ) ALIF LAILA THE ALBUM.mp3"] }
];

const LS="bantora_v4";
let userPL=[];
function loadUser(){try{const r=localStorage.getItem(LS);if(r)userPL=JSON.parse(r).map(p=>({...p,type:"user",songs:p.songs.map(s=>({...s,url:null}))}));}catch(e){}}
function saveUser(){try{localStorage.setItem(LS,JSON.stringify(userPL.map(p=>({id:p.id,name:p.name,desc:p.desc,coverDataUrl:p.coverDataUrl||null,songs:p.songs.map(s=>({id:s.id,name:s.name,size:s.size}))}))));}catch(e){}}
function allPL(){return[...BUNDLED,...userPL];}

/* ── Utils ── */
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function cleanName(fn){
  let n=decodeURIComponent(fn).replace(/\.(mp3|m4a|aac|flac|wav|ogg)$/i,"");
  return n.replace(/\(pagalworldi\.com\.co\)/gi,"").replace(/\(koshalworld\.com\)/gi,"").replace(/\(mp3\.pm\)/gi,"").replace(/HindiRapsong2021/gi,"").replace(/@SeedheMaut/gi,"").replace(/\(Official Video\)/gi,"").replace(/Def Jam India/gi,"").replace(/Parvana EP/gi,"").replace(/What We Cookin/gi,"").replace(/[-_]{2,}/g," ").replace(/\s{2,}/g," ").trim()||fn;
}
function fmtTime(s){if(isNaN(s)||s<0)return"00:00";const m=Math.floor(s/60),sc=Math.floor(s%60);return`${m<10?"0":""}${m}:${sc<10?"0":""}${sc}`;}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+" MB":(b/1024|0)+" KB";}
let toastT;
function showToast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2500);}

/* ── Tab routing ── */
function goTab(tab){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  const scrEl=document.getElementById(tab==="library"?"scr-lib":"scr-player");
  const tabEl=document.getElementById(tab==="library"?"tab-library":"tab-player");
  if(scrEl)scrEl.classList.add("active");
  if(tabEl)tabEl.classList.add("active");
  // Show/hide background blur
  const bgImg=$("bg-img");
  if(tab==="player")bgImg.classList.add("visible");
  else bgImg.classList.remove("visible");
  if(tab==="library"){renderAllPL();showView("all");}
}
function showView(name){
  document.querySelectorAll(".lib-view").forEach(v=>v.classList.remove("active"));
  $("view-"+name).classList.add("active");
}

/* ── Audio ── */
const aud=new Audio();
aud.preload="metadata";
let cur={plId:null,idx:-1,playing:false,seeking:false};

function syncPlayUI(){
  const p=cur.playing;
  $("ic-play").style.display=p?"none":"block";
  $("ic-pause").style.display=p?"block":"none";
  $("play-ping").style.display=p?"block":"none";
  $("ring-wrap").className=p?"on":"";
  $("mi-play").style.display=p?"none":"block";
  $("mi-pause").style.display=p?"block":"none";
  document.querySelectorAll(".sv").forEach(e=>e.style.animationPlayState=p?"running":"paused");
}

function setPlayerUI(title,plName,coverSrc){
  const ci=$("cover-img");
  ci.style.opacity="0";
  setTimeout(()=>{
    ci.src=coverSrc;
    ci.onload=()=>ci.style.opacity="1";
    ci.onerror=()=>{ci.src="logo.png";ci.style.opacity="1";};
  },80);
  $("bg-img").style.backgroundImage=`url('${coverSrc}')`;
  $("bg-img").classList.add("visible");
  $("track-title").textContent=title;
  $("track-artist").textContent=plName;
  $("now-pl-name").textContent=plName;
  $("mini-title").textContent=title;
  $("mini-sub").textContent=plName;
  $("mini-cover").src=coverSrc;
  $("mini-player").classList.add("show");
}

function playSong(plId,idx,auto){
  const pl=allPL().find(p=>p.id===plId);if(!pl)return;
  cur.plId=plId;cur.idx=idx;
  let title,cover,src;
  if(pl.type==="bundled"){
    const f=pl.songs[idx];
    title=cleanName(f);cover=pl.cover;
    src=`songs/${pl.folder}/${encodeURIComponent(f)}`;
  }else{
    const sg=pl.songs[idx];if(!sg)return;
    if(!sg.url){showToast("Re-add this song — session reset");return;}
    title=cleanName(sg.name);cover=pl.coverDataUrl||"logo.png";src=sg.url;
  }
  setPlayerUI(title,pl.name,cover);
  aud.src=src;aud.load();
  if(auto){aud.play().then(()=>{cur.playing=true;syncPlayUI();}).catch(()=>{});}
  else{cur.playing=false;syncPlayUI();}
  renderSongs();renderAllPL();
}

function audioNext(){
  const pl=allPL().find(p=>p.id===cur.plId);if(!pl)return;
  if(cur.idx<pl.songs.length-1)playSong(cur.plId,cur.idx+1,true);
  else{cur.playing=false;syncPlayUI();}
}
function audioPrev(){
  if(aud.currentTime>3){aud.currentTime=0;return;}
  if(cur.idx>0)playSong(cur.plId,cur.idx-1,true);
}
function togglePlay(){
  if(!aud.src||aud.src===window.location.href)return;
  if(cur.playing){aud.pause();cur.playing=false;}
  else{aud.play().then(()=>{cur.playing=true;syncPlayUI();}).catch(()=>{});return;}
  syncPlayUI();
}

aud.addEventListener("ended",audioNext);
aud.addEventListener("timeupdate",()=>{
  if(cur.seeking)return;
  const p=aud.duration?(aud.currentTime/aud.duration)*100:0;
  $("seek-fill").style.width=p+"%";
  $("seek-input").value=aud.currentTime;
  $("t-cur").textContent=fmtTime(aud.currentTime);
  $("mini-bar").style.width=p+"%";
});
aud.addEventListener("loadedmetadata",()=>{
  $("seek-input").max=aud.duration||100;
  $("t-tot").textContent=fmtTime(aud.duration);
});

/* ── Library ── */
let detailId=null;

function renderAllPL(){
  const all=allPL();
  const total=all.reduce((a,p)=>a+(p.songs?.length||0),0);
  const size=userPL.reduce((a,p)=>a+p.songs.reduce((b,s)=>b+(s.size||0),0),0);
  $("st-pl").textContent=all.length;
  $("st-songs").textContent=total;
  $("st-size").textContent=(size/1048576).toFixed(1);
  $("lib-sub-txt").textContent=all.length+" playlist"+(all.length!==1?"s":"")+" · "+total+" songs";

  const scroll=$("pl-scroll");scroll.innerHTML="";
  all.forEach(pl=>{
    const isNow=pl.id===cur.plId;
    const n=pl.songs?.length||0;
    const tile=document.createElement("div");
    tile.className="pl-tile"+(isNow?" now":"");

    const wrap=document.createElement("div");wrap.className="pl-tile-img-wrap";
    const coverSrc=pl.type==="bundled"?pl.cover:(pl.coverDataUrl||null);
    if(coverSrc){
      const img=document.createElement("img");img.className="pl-tile-img";img.alt="";img.src=coverSrc;
      img.onerror=function(){const ph=document.createElement("div");ph.className="pl-tile-ph";ph.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';this.parentNode.replaceChild(ph,this);};
      wrap.appendChild(img);
    }else{
      const ph=document.createElement("div");ph.className="pl-tile-ph";ph.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';wrap.appendChild(ph);
    }
    tile.appendChild(wrap);
    tile.innerHTML+=`<div class="pl-tile-name">${pl.name}</div><div class="pl-tile-count">${n} song${n!==1?"s":""}${pl.type==="bundled"?" · Built-in":""}</div>`;
    tile.onclick=()=>openDetail(pl.id);
    scroll.appendChild(tile);
  });

  // New tile
  const nt=document.createElement("div");nt.className="pl-new-tile";
  nt.innerHTML='<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>New</span>';
  nt.onclick=()=>openModal("create");
  scroll.appendChild(nt);
}

function openDetail(plId){
  detailId=plId;
  const pl=allPL().find(p=>p.id===plId);if(!pl)return;
  const isUser=pl.type==="user";
  $("upload-zone").style.display=isUser?"flex":"none";
  $("btn-edit-pl").style.display=isUser?"flex":"none";
  $("btn-del-pl").style.display=isUser?"block":"none";
  renderSongs();showView("detail");
}

function renderSongs(){
  const pl=allPL().find(p=>p.id===detailId);if(!pl)return;
  $("det-title").textContent=pl.name;
  $("det-sub").textContent=pl.songs.length+" song"+(pl.songs.length!==1?"s":"");
  $("det-count").textContent=pl.songs.length+" Songs";
  const list=$("songs-list");list.innerHTML="";

  if(!pl.songs.length){
    list.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><div class="empty-ttl">No songs yet</div><div class="empty-sub">${pl.type==="user"?"Tap Add Songs to upload":"This playlist is empty"}</div></div>`;
    return;
  }

  pl.songs.forEach((sg,i)=>{
    const isOn=pl.id===cur.plId&&i===cur.idx;
    const row=document.createElement("div");
    row.className="song-row"+(isOn?" playing":"");
    const covHtml=pl.type==="bundled"
      ?`<div class="s-art"><img src="${pl.cover}" onerror="this.style.display='none'" alt=""/></div>`
      :`<div class="s-art"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>`;
    const name=pl.type==="bundled"?cleanName(sg):cleanName(sg.name);
    const meta=pl.type==="bundled"?"Built-in":((sg.url?"✓":"\u26a0\ufe0f Re-add")+" · "+fmtSize(sg.size||0));
    const del=pl.type==="user"?`<button class="s-del"><svg viewBox="0 0 24 24"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6M14,11v6"/></svg></button>`:"";
    row.innerHTML=`
      <div class="s-num">${String(i+1).padStart(2,"0")}</div>
      <div class="s-wave"><div class="sv sv1"></div><div class="sv sv2"></div><div class="sv sv3"></div><div class="sv sv4"></div></div>
      ${covHtml}
      <div class="s-info"><div class="s-name">${name}</div><div class="s-meta">${meta}</div></div>
      ${del}`;
    row.querySelectorAll(".sv").forEach(w=>w.style.animationPlayState=(isOn&&cur.playing)?"running":"paused");
    row.onclick=e=>{if(e.target.closest(".s-del"))return;playSong(detailId,i,true);};
    if(pl.type==="user"){
      row.querySelector(".s-del").onclick=e=>{
        e.stopPropagation();
        const sg2=pl.songs[i];
        confirmDo(`Delete "${cleanName(sg2.name)}"?`,"Removed from playlist.",()=>{
          if(sg2.url)URL.revokeObjectURL(sg2.url);
          pl.songs.splice(i,1);
          if(cur.plId===detailId&&cur.idx===i){aud.pause();cur.playing=false;syncPlayUI();}
          else if(cur.plId===detailId&&cur.idx>i)cur.idx--;
          saveUser();renderSongs();renderAllPL();showToast("Song removed");
        });
      };
    }
    list.appendChild(row);
  });
}

/* ── Modal + Confirm ── */
let mMode="create",mId=null,mCovFile=null;
function openModal(mode,pl=null){
  mMode=mode;mId=pl?.id||null;mCovFile=null;
  $("sh-modal-title").textContent=mode==="create"?"New Playlist":"Edit Playlist";
  $("sh-save-btn").textContent=mode==="create"?"Create Playlist":"Save Changes";
  $("pl-name-input").value=pl?.name||"";
  $("pl-desc-input").value=pl?.desc||"";
  const prev=$("cov-preview"),icon=$("cov-icon");
  if(pl?.coverDataUrl){prev.src=pl.coverDataUrl;prev.style.display="block";icon.style.display="none";}
  else{prev.style.display="none";icon.style.display="block";}
  $("pl-modal").classList.add("show");
  setTimeout(()=>$("pl-name-input").focus(),300);
}
function closeModal(){$("pl-modal").classList.remove("show");$("cov-file").value="";}

let confCb=null;
function confirmDo(ttl,msg,cb){
  $("conf-ttl").textContent=ttl;$("conf-msg").textContent=msg;
  confCb=cb;$("conf-modal").classList.add("show");
}

/* ── Init (all DOM wiring inside window.onload) ── */
window.addEventListener("load",function(){
  // Seek
  $("seek-input").addEventListener("input",function(){
    cur.seeking=true;
    $("seek-fill").style.width=(aud.duration?(parseFloat(this.value)/aud.duration)*100:0)+"%";
    $("t-cur").textContent=fmtTime(parseFloat(this.value));
  });
  $("seek-input").addEventListener("change",function(){aud.currentTime=parseFloat(this.value);cur.seeking=false;});

  // Player buttons
  $("play-btn").onclick=togglePlay;
  $("btn-prev").onclick=audioPrev;
  $("btn-next").onclick=audioNext;
  $("btn-open-lib").onclick=()=>goTab("library");

  // Library
  $("btn-back").onclick=()=>{showView("all");renderAllPL();};
  $("btn-new-pl").onclick=()=>openModal("create");
  $("btn-edit-pl").onclick=()=>{const pl=userPL.find(p=>p.id===detailId);if(pl)openModal("edit",pl);};
  $("btn-del-pl").onclick=()=>{
    const pl=userPL.find(p=>p.id===detailId);if(!pl)return;
    confirmDo(`Delete "${pl.name}"?`,"Playlist and all songs removed.",()=>{
      pl.songs.forEach(s=>{if(s.url)URL.revokeObjectURL(s.url);});
      userPL=userPL.filter(p=>p.id!==detailId);
      if(cur.plId===detailId){aud.pause();cur.playing=false;syncPlayUI();}
      saveUser();showView("all");renderAllPL();showToast("Playlist deleted");
    });
  };

  // Upload
  $("upload-zone").onclick=()=>$("file-pick").click();
  $("file-pick").addEventListener("change",async function(){
    const files=Array.from(this.files||[]);if(!files.length)return;
    const pl=userPL.find(p=>p.id===detailId);if(!pl)return;
    const pw=$("prog-wrap"),pf=$("prog-fill"),pl_=$("prog-lbl");
    pw.classList.add("show");let added=0;
    for(let i=0;i<files.length;i++){
      pl_.textContent=`Adding ${i+1}/${files.length}…`;
      pf.style.width=((i/files.length)*100)+"%";
      if(!pl.songs.find(s=>s.name===files[i].name)){
        pl.songs.push({id:uid(),name:files[i].name,url:URL.createObjectURL(files[i]),size:files[i].size});
        added++;
      }
      await new Promise(r=>setTimeout(r,40));
    }
    pf.style.width="100%";
    setTimeout(()=>{pw.classList.remove("show");pf.style.width="0%";},600);
    this.value="";saveUser();renderSongs();renderAllPL();
    showToast(added>0?`${added} song${added>1?"s":""} added`:"Already exists");
  });

  // Cover
  $("cov-file").addEventListener("change",function(){
    const f=this.files[0];if(!f)return;mCovFile=f;
    const r=new FileReader();
    r.onload=e=>{$("cov-preview").src=e.target.result;$("cov-preview").style.display="block";$("cov-icon").style.display="none";};
    r.readAsDataURL(f);
  });

  // Modal save
  $("sh-save-btn").onclick=async()=>{
    const name=$("pl-name-input").value.trim();if(!name){showToast("Enter a name");return;}
    let cov=null;
    if(mCovFile)cov=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(mCovFile);});
    if(mMode==="create"){
      const id=uid();
      userPL.push({id,type:"user",name,desc:$("pl-desc-input").value.trim(),coverDataUrl:cov,songs:[]});
      detailId=id;saveUser();closeModal();renderAllPL();openDetail(id);showToast(`"${name}" created`);
    }else{
      const pl=userPL.find(p=>p.id===mId);
      if(pl){pl.name=name;pl.desc=$("pl-desc-input").value.trim();if(cov)pl.coverDataUrl=cov;}
      saveUser();closeModal();renderAllPL();if(detailId===mId)renderSongs();showToast("Updated");
    }
  };
  $("sh-close").onclick=closeModal;
  $("sh-cancel-btn").onclick=closeModal;
  $("pl-modal").addEventListener("click",e=>{if(e.target===$("pl-modal"))closeModal();});

  // Confirm
  $("conf-ok").onclick=()=>{$("conf-modal").classList.remove("show");if(confCb)confCb();confCb=null;};
  $("conf-cancel").onclick=()=>{$("conf-modal").classList.remove("show");confCb=null;};

  // Boot
  loadUser();
  playSong("bp",0,false);
  renderAllPL();
});
</script>
</body>
</html>
