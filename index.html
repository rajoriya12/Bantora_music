<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bantora</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Boogaloo&family=Salsa&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
</head>

<body>
    <!-- Animated fluid background -->
    <div class="animated-background">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>

    <div id="maindiv">
        
        <!-- Top Nav -->
        <header class="glass-header">
            <div class="left-nav flex alingitem">
                <div class="hamburger">☰</div>
                <img src="logo.png" alt="Bantora logo" class="brand-logo logo invert">
                <h2 class="brand-text">Bantora</h2>
            </div>

            <div class="search-bar glass-panel flex alingitem">
                <img src="search.svg" alt="search" class="search-icon invert">
                <input type="text" placeholder="Discover new vibes...">
            </div>
        </header>

        <!-- Main Interface -->
        <main class="app-interface">
            
            <!-- Sliding Library Drawer -->
            <aside id="library-drawer" class="glass-drawer">
                <div class="drawer-header flex justfyspace alingitem">
                    <h3>Your Library</h3>
                    <div class="close-btn">✕</div>
                </div>
                
                <div class="playlists-container">
                    <!-- Cards will be injected here via JS -->
                    <div class="cardContener"></div>
                </div>

                <div class="tracklist-container">
                    <h4 style="margin: 20px 0 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom:5px;">Tracks</h4>
                    <ul class="songslist-ul">
                        <!-- Songs injected here -->
                    </ul>
                </div>
            </aside>

            <!-- Centerpiece Player -->
            <section class="player-centerpiece">
                <div class="vinyl-wrapper">
                    <div class="vinyl-record" id="vinyl">
                        <img src="logo.png" id="cover-art" alt="Cover Art">
                        <div class="vinyl-hole"></div>
                    </div>
                </div>

                <div class="now-playing-info text-center">
                    <h1 id="track-title" class="track-title">Select a track</h1>
                    <p id="track-artist" class="track-artist">Bantora</p>
                </div>

                <!-- Glass Controls -->
                <div class="glass-controls">
                    <!-- Progress -->
                    <div class="progress-container flex alingitem">
                        <span class="songtime">00:00</span>
                        <div class="seekbaar">
                            <div class="circal"></div>
                        </div>
                        <span class="totaltime">00:00</span>
                    </div>

                    <!-- Buttons -->
                    <div class="playback-buttons flex justfycontent alingitem">
                        <img id="previous" class="control-btn invert" src="previous.svg" alt="prev">
                        <div class="play-btn-wrapper flex justfycontent alingitem">
                            <img id="play" class="control-btn invert main-play" src="play.svg" alt="play">
                        </div>
                        <img id="next" class="control-btn invert" src="forword.svg" alt="next">
                    </div>

                    <!-- Volume -->
                    <div class="volume-container flex alingitem">
                        <img class="vol invert control-btn-small" src="volume.svg" alt="vol">
                        <input type="range" class="volrange glass-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
